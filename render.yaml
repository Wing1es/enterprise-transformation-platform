databases:
  - name: modus-postgres
    plan: free

services:
  # FastAPI Web Service
  - type: web
    name: modus-api
    env: python
    plan: free
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: modus-postgres
          property: connectionString
      - key: QDRANT_URL
        sync: false # User must set this manually in the dashboard
      - key: PYTHON_VERSION
        value: 3.11.0
